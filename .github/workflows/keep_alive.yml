# =============================================================================
# PerfumeTrending.cl — Workflow CI/CD: Keep-Alive Streamlit Cloud
# =============================================================================
# Propósito:
# Realiza una petición HTTP periódica cada 6 horas hacia la URL de producción
# en Streamlit Community Cloud para evitar que el contenedor entre en estado
# de hibernación por inactividad.
name: Keep-Alive Streamlit Cloud

on:
  schedule:
    # Ejecuta cada 6 horas para evitar que Streamlit Cloud hiberne por inactividad
    - cron: '0 */6 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde la pestaña Actions en GitHub

jobs:
  keepalive:
    # Ejecuta sobre un runner liviano Ubuntu en GitHub Actions
    runs-on: ubuntu-latest
    steps:
      # Paso único: Enviar petición GET con curl siguiendo redirecciones y verificar código HTTP
      - name: Ping Streamlit Production App
        run: |
          echo "Pinging https://perfumetrending-cl.streamlit.app/ ..."
          HTTP_RESPONSE=$(curl -s -L -b "" -c "" --max-time 30 -o /dev/null -w "%{http_code}" https://perfumetrending-cl.streamlit.app/ || echo "000")
          echo "HTTP Status Code recibido: $HTTP_RESPONSE"
          if [ "$HTTP_RESPONSE" -ge 200 ] && [ "$HTTP_RESPONSE" -lt 500 ]; then
            echo "[SUCCESS] Aplicacion activa y en ejecucion en produccion."
          else
            echo "[WARNING] Alerta: Codigo HTTP $HTTP_RESPONSE recibido."
          fi
