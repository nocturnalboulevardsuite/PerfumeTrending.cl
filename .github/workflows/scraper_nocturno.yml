name: Actualizacion Nocturna de Precios y Stock

on:
  schedule:
    # Se ejecuta todos los dias a las 04:00 AM hora de Chile (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Cantidad de perfumes por rotacion (lote)'
        required: false
        default: '500'
      rotations:
        description: 'Numero de rotaciones a ejecutar (0 = todas las necesarias para cubrir el catalogo)'
        required: false
        default: '0'
      delay:
        description: 'Segundos de cooldown entre rotaciones'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  actualizar-precios:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    concurrency:
      group: scraper-nocturno-precios-shard-${{ matrix.shard }}
      cancel-in-progress: false
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar entorno Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar Scraper Periodico de Precios y Stock (Rotaciones LRU - Shard ${{ matrix.shard }}/2)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_BATCH_SIZE: ${{ inputs.batch_size || '500' }}
          SCRAPER_ROTATIONS: ${{ inputs.rotations || '0' }}
          SCRAPER_DELAY_ROTATIONS: ${{ inputs.delay || '10' }}
          SCRAPER_SHARD: ${{ matrix.shard }}
          SCRAPER_TOTAL_SHARDS: 2
        run: |
          python APP/backend/scraper_periodico.py --shard ${{ matrix.shard }} --total-shards 2

      - name: Sincronizar reporte de auditoria en GitHub si hubo cambios
        run: |
          git config --global user.name "PerfumeTrending Bot"
          git config --global user.email "bot@perfumetrending.cl"
          git add APP/data/reportes/
          if git diff --staged --quiet; then
            echo "No se registraron cambios de reporte en esta ejecucion (shard ${{ matrix.shard }})."
          else
            git commit -m "chore(etl): reporte auditoria shard ${{ matrix.shard }}/2 [skip ci]"
            for i in {1..5}; do
              git pull --rebase origin main && git push origin main && break || sleep 5
            done
            echo "Reporte shard ${{ matrix.shard }} sincronizado exitosamente con el repositorio."
          fi
